[package]
name = "gol"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1

[profile.release.package."*"]
codegen-units = 16

[dependencies]
sdl2 = "*"
rand = "*"
rayon = "*"
lazy_static = "*"
clap = { version = "4.0", features = ["derive"] }
